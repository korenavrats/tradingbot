name: Live Trading Bot Scheduler

on:
  schedule:
    # דקות לא עגולות כדי להימנע מעומס; ימי א'-ו' בשעות המסחר (UTC)
    - cron: '7,22,37,52 13-23 * * 1-5'
    # הרצה לדו"ח השבועי: שבת 12:30 שעון ישראל (בערך 09:30 UTC)
    - cron: '30 9 * * 6'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: trading-bot
  cancel-in-progress: false

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install yfinance pandas numpy lightgbm

      - name: Run Trading Bot
        env:
          SENDER_EMAIL: ${{ secrets.SENDER_EMAIL }}
          SENDER_PASSWORD: ${{ secrets.SENDER_PASSWORD }}
          RECEIVER_EMAIL: ${{ secrets.RECEIVER_EMAIL }}
        run: python trading_bot.py

      - name: Commit and push bot state
        run: |
          git config user.name "GitHub Actions Bot"
          git config user.email "actions@github.com"
          if [ -f bot_state.json ]; then
            git add bot_state.json
            git diff --cached --quiet && exit 0
            git commit -m "Auto-update bot state"
            git pull --rebase origin ${{ github.ref_name }}
            git push
          fi
