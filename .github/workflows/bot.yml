name: Live Trading Bot Scheduler

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch: 

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install yfinance pandas numpy lightgbm

      - name: Run Trading Bot
        env:
          SENDER_EMAIL: ${{ secrets.SENDER_EMAIL }}
          SENDER_PASSWORD: ${{ secrets.SENDER_PASSWORD }}
          RECEIVER_EMAIL: ${{ secrets.RECEIVER_EMAIL }}
        run: |
          python live_bot.py

      - name: Commit and push updated bot state (JSON)
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"
          if [ -f bot_state.json ]; then
            git add bot_state.json
            git commit -m "Auto-update bot state & preserve active trades" || exit 0
            git push
          else
            echo "No state file found yet, skipping commit."
          fi
